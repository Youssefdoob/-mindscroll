<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10131b"><title>MindScroll — Learn instead of scroll</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#10131b;color:#fff;font-family:system-ui,-apple-system,Segoe UI,sans-serif}button{font:inherit;cursor:pointer}header{height:64px;position:absolute;top:0;left:0;right:0;z-index:4;display:flex;align-items:center;justify-content:space-between;padding:12px 18px;background:linear-gradient(#10131be8,#10131b00)}.logo{font-weight:850;font-size:22px;letter-spacing:-.7px}.logo b{color:#a9f17a}.badge{background:#252b36;padding:8px 12px;border-radius:25px;font-size:13px}.feed{height:100dvh;overflow-y:auto;scroll-snap-type:y mandatory;scrollbar-width:none}.feed::-webkit-scrollbar{display:none}.card{height:100dvh;scroll-snap-align:start;scroll-snap-stop:always;position:relative;display:flex;flex-direction:column;justify-content:center;padding:90px 26px 104px;overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 22%,var(--glow),transparent 49%);opacity:.75;pointer-events:none}.inner{position:relative;max-width:650px;margin:auto;width:100%}.category{display:inline-block;font-size:12px;letter-spacing:2px;font-weight:800;text-transform:uppercase;color:#c7d3e7}.emoji{font-size:65px;margin:18px 0}.title{font-size:clamp(31px,8vw,51px);font-weight:850;line-height:1.08;letter-spacing:-1.5px;margin:0 0 22px}.body{font-size:clamp(17px,4.5vw,22px);line-height:1.5;color:#e4e8ef;margin:0}.fact{border-left:3px solid #a9f17a;margin-top:23px;padding:9px 0 9px 16px;color:#c7d8d4;font-size:15px}.actions{display:flex;gap:10px;margin-top:27px;flex-wrap:wrap}.pill{background:#ffffff18;color:white;border:1px solid #ffffff35;border-radius:100px;padding:11px 16px}.pill.saved{background:#a9f17a;color:#15200c}.next{position:absolute;bottom:91px;left:0;right:0;text-align:center;color:#c0c9d7;font-size:13px;animation:bob 2s infinite}@keyframes bob{50%{transform:translateY(7px)}}nav{position:absolute;bottom:0;left:0;right:0;z-index:5;height:74px;padding-bottom:env(safe-area-inset-bottom);display:flex;align-items:center;justify-content:space-around;background:#121722e8;backdrop-filter:blur(12px);border-top:1px solid #ffffff17}nav button{border:0;background:none;color:#b6c0cf;font-size:12px;display:grid;gap:4px;place-items:center}nav button span{font-size:23px}nav button.active{color:#a9f17a}.overlay{display:none;position:absolute;inset:0;z-index:7;background:#10131b;overflow:auto;padding:75px 22px 100px}.overlay.show{display:block}.overlay h2{font-size:30px;margin:0 0 10px}.muted{color:#aab5c5}.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:25px}.chip{border:1px solid #526071;background:#222a36;color:#fff;padding:13px 15px;border-radius:25px}.chip.on{background:#a9f17a;color:#13210c;border-color:#a9f17a}.stat{background:#222a36;border-radius:18px;padding:18px;margin:15px 0}.quiz{margin-top:25px}.choice{width:100%;text-align:left;display:block;background:#252c39;border:1px solid #4b5666;color:#fff;border-radius:15px;padding:15px;margin:10px 0}.choice.correct{background:#244e39;border-color:#7ee4a1}.choice.wrong{background:#5d3037;border-color:#f29ca6}.feedback{min-height:25px;color:#d2e8d0;margin-top:15px}.empty{padding:20px;background:#242c38;border-radius:18px}.small{font-size:13px;color:#aab5c5}#aiGenerate{border:0;background:#a9f17a;color:#13210c;border-radius:20px;padding:8px 12px;font-size:12px;font-weight:750}#aiStatus{position:absolute;top:67px;right:10px;z-index:8;background:#202b38;color:#fff;padding:10px 14px;border-radius:14px;max-width:85vw;font-size:12px;display:none;box-shadow:0 5px 30px #0007}#aiStatus.show{display:block}.deep{margin-top:14px;padding:16px;border:1px solid #67728a;border-radius:16px;background:#1c2739;line-height:1.6}.deep[hidden]{display:none}.deep a{color:#92c7ff} </style></head><body>
<header><div class="logo">Mind<b>Scroll</b> ✦</div><button id="aiGenerate" onclick="generateFree()">🌐 Free discoveries</button><div class="badge" id="topStat">🔥 0 learned</div></header><div id="aiStatus" role="status"></div><main id="feed" class="feed"></main><section id="topics" class="overlay"><h2>Choose your universe 🌍</h2><p class="muted">Select the subjects you want in your feed.</p><div id="chips" class="chips"></div><p class="small">Your choices are saved on this device.</p></section><section id="saved" class="overlay"><h2>Saved discoveries 🔖</h2><p class="muted">Your personal collection of things worth remembering.</p><div id="savedItems"></div></section><section id="profile" class="overlay"><h2>Your brain is growing 🧠</h2><div class="stat" id="learnedStat"></div><div class="stat" id="quizStat"></div><p class="muted">A little curiosity every day adds up. Swipe to keep learning.</p><button class="pill" onclick="resetProgress()">Reset progress</button></section><nav><button id="nav-feed" class="active" onclick="openTab('feed')"><span>🏠</span>Discover</button><button id="nav-topics" onclick="openTab('topics')"><span>🧭</span>Topics</button><button id="nav-saved" onclick="openTab('saved')"><span>🔖</span>Saved</button><button id="nav-profile" onclick="openTab('profile')"><span>📊</span>Progress</button></nav>
<script>
const data=[
['History','🏛️','The ancient world had vending machines','Around 2,000 years ago, Hero of Alexandria described a machine that dispensed holy water when a coin was inserted. The coin tipped a lever that opened a valve.','Innovation is much older than electricity.','What triggered the valve?',['A coin','A candle','A magnet'],0],
['Geography','🌍','Africa is much bigger than it looks','On many common world maps, Greenland looks almost as big as Africa. In reality, Africa has roughly 14 times Greenland’s land area.','Map projections can distort our sense of the world.','Which is larger?',['Greenland','Africa','They are equal'],1],
['Psychology','🧠','Your brain edits your vision','Your eyes have a blind spot where the optic nerve exits the retina. You usually never notice because your brain fills in missing visual information.','What you see is a construction, not a perfect recording.','Why is there a blind spot?',['No cones at the optic disc','Your eyelid blocks it','Light bends away'],0],
['Mythology','⚡','Thor did not always look like a superhero','In Norse mythology, Thor rides a chariot pulled by two goats named Tanngrisnir and Tanngnjóstr. His hammer is called Mjölnir.','Ancient myths often differ from modern movies.','What pulled Thor’s chariot?',['Wolves','Goats','Horses'],1],
['Economy','💸','Inflation and prices are not the same thing','If inflation drops from 8% to 2%, prices are still rising, just more slowly. Falling prices across the economy are called deflation.','A lower inflation rate does not usually mean cheaper groceries.','Inflation falling from 8% to 2% means…',['Prices fall 6%','Prices rise more slowly','Prices freeze'],1],
['Architecture','🏗️','Roman concrete could heal some cracks','Some ancient Roman concrete contains lime clasts that can react with water and help seal certain cracks. Researchers have studied this as a clue to its durability.','Old engineering can inspire new materials.','What can activate the crack-sealing reaction?',['Water','Moonlight','Salt alone'],0],
['Cinema','🎬','Movies create motion from still images','Films display a rapid sequence of separate images. Your visual system interprets the changes as continuous movement. Many films are projected at 24 frames per second.','The illusion works because of how we perceive time and motion.','A common cinema frame rate is…',['2 fps','24 fps','2400 fps'],1],
['Technology','📡','Wi-Fi uses radio waves, not internet magic','Your router exchanges information with devices using electromagnetic waves, commonly in the 2.4, 5, and 6 GHz bands. The internet connection itself comes from another network link.','Wi-Fi and internet access are different things.','Which carries Wi-Fi signals?',['Sound waves','Radio waves','Water waves'],1],
['Space','🪐','A day on Venus is longer than its year','Venus takes about 243 Earth days to rotate once relative to the stars, but only about 225 Earth days to orbit the Sun.','Planetary days and years can be surprisingly different.','Which takes longer on Venus?',['One rotation','One orbit','Exactly equal'],0],
['Biology','🫀','Your heart has its own pacemaker','A cluster of cells called the sinoatrial node generates electrical signals that initiate each normal heartbeat. The brain can change the rate, but it does not trigger every beat.','Your body is full of autonomous control systems.','What normally starts a heartbeat?',['Sinoatrial node','Lungs','Stomach'],0],
['Art','🎨','Blue was once a luxury color','Ultramarine pigment was traditionally made from lapis lazuli, a precious stone imported from distant mines. In European painting it could cost more than many other pigments.','The price of materials influenced artistic choices.','Traditional ultramarine came from…',['Lapis lazuli','Copper wire','Charcoal'],0],
['Philosophy','🤔','Socrates wrote no known books','Much of what we know about Socrates comes from accounts by others, especially Plato and Xenophon. This makes reconstructing his actual beliefs difficult.','History often reaches us through other people’s lenses.','Who wrote dialogues featuring Socrates?',['Plato','Newton','Darwin'],0],
['Animals','🐙','Octopuses have three hearts','Two hearts pump blood toward the gills, and one pumps oxygenated blood around the body. Their blood uses copper-based hemocyanin to transport oxygen.','Biology has more than one way to solve the same problem.','How many hearts does an octopus have?',['One','Two','Three'],2],
['Coding','💻','The first computer bug was a real moth','In 1947, engineers working on the Harvard Mark II documented a moth found in a relay. The word “bug” already existed in engineering, but this incident became famous.','The moth did not invent the term “debugging.”','Where was the moth found?',['A relay','A keyboard','A monitor'],0],
['Maths','♾️','Some infinities are bigger than others','The natural numbers and real numbers are both infinite sets, but Cantor proved the real numbers cannot be listed one by one in the same way as natural numbers.','Infinity is not just one size.','Which set is uncountable?',['Natural numbers','Integers','Real numbers'],2],
['Music','🎵','A musical octave doubles frequency','If one note has a frequency of 220 Hz, the note one octave above is 440 Hz. The pitch sounds related even though the frequency doubles.','Music and mathematics are deeply connected.','One octave above 220 Hz is…',['330 Hz','440 Hz','880 Hz'],1],
['Paleontology','🦖','Birds are living dinosaurs','Modern birds evolved from theropod dinosaurs. In evolutionary classification, birds belong within Dinosauria, so dinosaurs did not all disappear 66 million years ago.','You may have seen a dinosaur today.','Which animals are living dinosaurs?',['Birds','Lizards','Crocodiles'],0],
['Business','📈','Revenue is not profit','Revenue is money a company earns from sales. Profit is what remains after relevant expenses are subtracted. A fast-growing business can have high revenue and still lose money.','Always ask what a financial number actually measures.','Revenue minus expenses is…',['Profit','Market share','Inventory'],0]
];
const key='mindscroll-v2';let state=JSON.parse(localStorage.getItem(key)||'{}');state.topics??=['History','Geography','Psychology','Mythology','Economy','Architecture','Cinema','Technology','Space','Biology','Art','Philosophy','Animals','Coding','Maths','Music','Paleontology','Business'];state.saved??=[];state.seen??=[];state.correct??=0;state.answered??={};let feedData=[];const curatedCount=data.length;const storedCards=JSON.parse(localStorage.getItem('mindscroll-ai-cards')||'[]');storedCards.forEach(c=>{if(Array.isArray(c)&&c.length===8)data.push(c)});const persist=()=>localStorage.setItem(key,JSON.stringify(state));const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function renderFeed(){let el=document.getElementById('feed');feedData=data.map((d,i)=>({d,i})).filter(x=>(state.topics.includes(x.d[0])||x.i>=curatedCount));if(!feedData.length){el.innerHTML='<div class="card"><div class="inner"><h1>Choose some topics 🧭</h1><p>Open Topics below to build your feed.</p></div></div>';return}el.innerHTML=feedData.map(({d,i},pos)=>`<article class="card" data-index="${i}" style="--glow:${['#324d8b','#5c3676','#275c5b','#80513b','#304e80'][pos%5]}"><div class="inner"><div class="category">${escapeHTML(d[0])} · ${pos+1}/${feedData.length}</div><div class="emoji">${d[1]}</div><h1 class="title">${escapeHTML(d[2])}</h1><p class="body">${escapeHTML(d[3])}</p><div class="fact">💡 ${escapeHTML(d[4])}</div><div class="actions"><button class="pill ${state.saved.includes(i)?'saved':''}" onclick="toggleSave(${i})">${state.saved.includes(i)?'✓ Saved':'♡ Save'}</button><button class="pill" onclick="showQuiz(${i})">🧠 Quick quiz</button><button class="pill" onclick="learnMore(${i})">📖 Learn more</button></div><div class="deep" id="deep-${i}" hidden></div><div class="quiz" id="quiz-${i}"></div></div><div class="next">↑ Swipe up for another discovery</div></article>`).join('');observer.disconnect();document.querySelectorAll('.card[data-index]').forEach(c=>observer.observe(c));updateStats()}
const observer=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting&&e.intersectionRatio>.6){let i=+e.target.dataset.index;if(!state.seen.includes(i)){state.seen.push(i);persist();updateStats()}}})},{root:document.getElementById('feed'),threshold:[.6]});
function toggleSave(i){state.saved=state.saved.includes(i)?state.saved.filter(n=>n!==i):[...state.saved,i];persist();let scroll=document.getElementById('feed').scrollTop;renderFeed();document.getElementById('feed').scrollTop=scroll}
function showQuiz(i){const d=data[i],el=document.getElementById('quiz-'+i);el.innerHTML=`<h3>🧠 Test your memory</h3><p>${escapeHTML(d[5])}</p>${d[6].map((a,n)=>`<button class="choice" onclick="answer(${i},${n})">${escapeHTML(a)}</button>`).join('')}<div class="feedback" id="feedback-${i}"></div>`;if(state.answered[i]!==undefined)answer(i,state.answered[i],true);el.scrollIntoView({behavior:'smooth',block:'center'})}
function answer(i,n,replay=false){const d=data[i],el=document.getElementById('quiz-'+i);if(!replay&&state.answered[i]!==undefined)return;if(!replay){state.answered[i]=n;if(n===d[7])state.correct++;persist()}el.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(j===d[7])b.classList.add('correct');else if(j===n)b.classList.add('wrong')});document.getElementById('feedback-'+i).textContent=n===d[7]?'🎉 Correct! Your brain just leveled up.':'Not quite — the green answer is correct.';updateStats()}
function renderTopics(){document.getElementById('chips').innerHTML=[...new Set(data.map(d=>d[0]))].sort().map(t=>`<button class="chip ${state.topics.includes(t)?'on':''}" onclick="toggleTopic('${t}')">${t}</button>`).join('')}
function toggleTopic(t){state.topics=state.topics.includes(t)?state.topics.filter(x=>x!==t):[...state.topics,t];persist();renderTopics();renderFeed()}
function renderSaved(){document.getElementById('savedItems').innerHTML=state.saved.length?state.saved.map(i=>`<div class="stat"><div class="small">${data[i][0]}</div><h3>${data[i][1]} ${escapeHTML(data[i][2])}</h3><p>${escapeHTML(data[i][3])}</p><button class="pill" onclick="jumpTo(${i})">Read card →</button></div>`).join(''):'<div class="empty">No saved discoveries yet. Tap ♡ Save on any card.</div>'}
function jumpTo(i){openTab('feed');let card=document.querySelector(`.card[data-index="${i}"]`);card?.scrollIntoView({behavior:'smooth'})}
function updateStats(){document.getElementById('topStat').textContent=`🔥 ${state.seen.length}`;document.getElementById('learnedStat').innerHTML=`<h2>${state.seen.length} 📚</h2><p>Discoveries viewed</p>`;document.getElementById('quizStat').innerHTML=`<h2>${state.correct}/${Object.keys(state.answered).length} 🎯</h2><p>Quizzes answered correctly</p>`}
function openTab(tab){document.querySelectorAll('.overlay').forEach(x=>x.classList.remove('show'));document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));document.getElementById('nav-'+tab).classList.add('active');if(tab!=='feed')document.getElementById(tab).classList.add('show');if(tab==='topics')renderTopics();if(tab==='saved')renderSaved();updateStats()}
function resetProgress(){if(confirm('Reset your learning progress and saved cards?')){state.seen=[];state.saved=[];state.correct=0;state.answered={};persist();renderFeed();updateStats()}}
let aiStatusTimer;function showAIStatus(message){const el=document.getElementById('aiStatus');el.textContent=message;el.classList.add('show');clearTimeout(aiStatusTimer);aiStatusTimer=setTimeout(()=>el.classList.remove('show'),6500)}
const deepNotes={
'History':'Hero’s coin-operated mechanism used the weight of a coin to move a lever, briefly opening a valve. It is an early example of an automatic machine: an input triggers a mechanical output. Ancient engineers also designed automatic doors and theatrical devices.',
'Geography':'The Mercator projection preserves local angles, which makes it useful for navigation, but it enlarges land near the poles. Africa covers about 30.4 million km², while Greenland covers about 2.17 million km². Compare equal-area maps to see relative sizes more accurately.',
'Psychology':'The optic disc has no photoreceptors because nerve fibers exit the eye there. Your brain estimates missing information from the surrounding scene and the other eye. Try covering one eye and moving a small dot across your visual field to find your blind spot.',
'Mythology':'Thor is a thunder god associated with strength and protection in Norse sources. The two goats pull his chariot, and some stories describe them being restored to life. Myths evolved through oral tradition, so there is no single canonical version.',
'Economy':'Inflation is the rate of change in the overall price level, not the level itself. At 8% annual inflation, a €100 basket would become €108 after a year; at 2% the following year it would become €110.16. Slower inflation does not reverse earlier price increases.',
'Architecture':'Researchers found that certain lime-rich fragments in ancient Roman concrete can dissolve when water enters cracks, then recrystallize as calcium carbonate. This can help seal small cracks under suitable conditions; it does not mean every Roman structure repairs itself.',
'Cinema':'Motion perception depends on multiple visual processes, including apparent motion between successive images. Film frame rates, shutter exposure and motion blur all influence how fluid motion looks. Twenty-four frames per second became a common cinema standard.',
'Technology':'Wi-Fi transmits encoded data over radio-frequency channels. Your device and router negotiate modulation, coding and airtime. Strong signal alone does not guarantee high speed: interference, congestion and the upstream internet link also matter.',
'Space':'A sidereal day measures rotation relative to distant stars. Venus rotates very slowly and in the opposite direction from most planets. Its solar day—the interval between noons—is about 117 Earth days, so “day” needs a precise definition.',
'Biology':'Pacemaker cells in the sinoatrial node spontaneously depolarize. Their electrical wave spreads through the atria and then the ventricles via the conduction system. The autonomic nervous system adjusts how quickly the pacemaker fires.',
'Art':'Natural ultramarine was made from lapis lazuli and prized for its vivid, stable blue. Its cost shaped how artists and patrons used it. Synthetic ultramarine, developed in the nineteenth century, made a similar color far more accessible.',
'Philosophy':'The Socratic problem is the difficulty of distinguishing the historical Socrates from the literary character in Plato’s dialogues. Xenophon and Aristophanes offer different portraits. Comparing sources helps historians judge what can be known.',
'Animals':'Octopus blood contains hemocyanin, which carries oxygen using copper rather than iron. Two branchial hearts push blood through the gills; the systemic heart distributes oxygenated blood. Their unusual circulation suits their marine physiology.',
'Coding':'The Harvard Mark II moth was taped into a logbook in 1947. Engineers had used the term “bug” for technical faults before this event. The story is a memorable example of the difference between the origin of a word and its popularization.',
'Maths':'Cantor’s diagonal argument shows that any proposed complete list of real numbers between 0 and 1 misses at least one number. By changing the nth digit of the nth listed number, you construct a number not on the list.',
'Music':'An octave corresponds to a frequency ratio of 2:1. In twelve-tone equal temperament, each semitone multiplies frequency by the twelfth root of two. This mathematical spacing explains how transposition works across keys.',
'Paleontology':'Birds share anatomical features with theropod dinosaurs, including feathers and particular skeletal traits. Fossils reveal many intermediate forms. The asteroid impact ended the non-avian dinosaurs, while the avian lineage survived.',
'Business':'Revenue is the top line of an income statement. Profit depends on which expenses are included: gross profit subtracts cost of goods sold, while net profit accounts for a broader set of costs and taxes. Cash flow is a separate measure.'};
function learnMore(i){const d=data[i],el=document.getElementById('deep-'+i);if(!el)return;el.hidden=!el.hidden;if(!el.hidden){el.innerHTML='<h3>📖 Deeper dive · 1–2 min</h3><p>'+escapeHTML(d.deep||deepNotes[d[0]]||d[3]+' '+d[4])+'</p>'+(d.source?'<p><a href="'+encodeURI(d.source)+'" target="_blank" rel="noopener noreferrer">Read the source ↗</a></p>':'');el.scrollIntoView({behavior:'smooth',block:'nearest'})}}
async function generateFree(){const btn=document.getElementById('aiGenerate');if(btn.disabled)return;btn.disabled=true;btn.textContent='⏳ Finding…';showAIStatus('Finding free, openly available knowledge on Wikipedia…');try{const topics=state.topics.length?state.topics:['History','Science'];const chosen=topics[Math.floor(Math.random()*topics.length)];const terms={Economy:'economics',Cinema:'cinema',Technology:'technology',Maths:'mathematics',Biology:'biology',Space:'astronomy',Paleontology:'paleontology',Coding:'computer science',Animals:'zoology',Business:'business',Architecture:'architecture',Psychology:'psychology',Mythology:'mythology',History:'history',Geography:'geography',Art:'art',Music:'music',Philosophy:'philosophy'};const term=terms[chosen]||chosen;const url='https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(term)+'&gsrlimit=12&prop=extracts|info&exintro=1&explaintext=1&exchars=1400&inprop=url&format=json&origin=*';const response=await fetch(url);if(!response.ok)throw Error('Knowledge source unavailable');const json=await response.json();const pages=Object.values(json.query?.pages||{}).filter(x=>x.extract&&x.extract.length>180&&!data.some(d=>d[2]===x.title));if(!pages.length)throw Error('No new articles found. Try another topic.');let added=0;for(const page of pages.slice(0,5)){const clean=page.extract.replace(/\s+/g,' ').trim();const short=clean.slice(0,Math.min(270,clean.length)).replace(/\s+\S*$/,'')+'…';const d=[chosen,'📚',page.title,short,'Explore the deeper explanation for context.',`Which subject does “${page.title}” belong to?`,[chosen,'Cooking','Sports'],0];d.deep=clean;d.source=page.fullurl||'https://en.wikipedia.org/wiki/'+encodeURIComponent(page.title.replace(/ /g,'_'));data.push(d);added++}const first=data.length-added;renderFeed();openTab('feed');setTimeout(()=>document.querySelector(`.card[data-index="${first}"]`)?.scrollIntoView({behavior:'smooth'}),120);showAIStatus('📚 '+added+' free discoveries added from Wikipedia. Internet required.')}catch(e){showAIStatus('Could not load free discoveries: '+e.message+' Your built-in lessons still work offline.')}finally{btn.disabled=false;btn.textContent='🌐 Free discoveries'}}
renderFeed();
</script></body></html>
